name: Build Zhengchen 1.54 TFT Wi-Fi from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack source ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          preferred='zhengchen-1.54tft-wifi-v100-square-buttons-deps.zip'
          if [ -f "$preferred" ]; then
            source_zip="$preferred"
          else
            zips=( *.zip )
            if [ "${#zips[@]}" -ne 1 ]; then
              echo "ERROR: Put the source ZIP in the repository root, or keep only one ZIP there. Found ${#zips[@]} ZIP files."
              printf ' - %s\n' "${zips[@]}"
              exit 1
            fi
            source_zip="${zips[0]}"
          fi
          mkdir -p /tmp/xiaozhi-source
          python - "$source_zip" <<'PY'
          import sys, zipfile
          from pathlib import Path
          archive = Path(sys.argv[1])
          dest = Path('/tmp/xiaozhi-source').resolve()
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  target = (dest / member.filename).resolve()
                  if target != dest and dest not in target.parents:
                      raise SystemExit(f'Unsafe path in ZIP: {member.filename}')
              z.extractall(dest)
          print(f'Extracted {archive} into {dest}')
          PY
          project_root="$(find /tmp/xiaozhi-source -type f -name CMakeLists.txt -print | while read -r f; do d="$(dirname "$f")"; if [ -f "$d/scripts/build.py" ] && [ -f "$d/main/CMakeLists.txt" ]; then echo "$d"; break; fi; done)"
          if [ -z "$project_root" ]; then
            echo 'ERROR: Could not find Xiaozhi project root (CMakeLists.txt, main/CMakeLists.txt, scripts/build.py).'
            find /tmp/xiaozhi-source -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"
          echo "Project root: $project_root"

      - name: Verify target board
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROJECT_ROOT/scripts/build.py"
          test -s "$PROJECT_ROOT/main/boards/zhengchen/1.54tft-wifi/config.json"
          python - "$PROJECT_ROOT/main/boards/zhengchen/1.54tft-wifi/config.json" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          cfg = json.loads(p.read_text(encoding='utf-8'))
          assert cfg.get('target') == 'esp32s3', f"Unexpected target: {cfg.get('target')}"
          assert any(b.get('name') == 'zhengchen-1.54tft-wifi' for b in cfg.get('builds', [])), 'Expected build variant is missing'
          print('Board config verified:', p)
          PY

      - name: Build firmware
        shell: bash
        working-directory: /tmp
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          cd "$PROJECT_ROOT"
          python scripts/build.py zhengchen/1.54tft-wifi --name zhengchen-1.54tft-wifi --language ru-RU --wake-word wn9_hiandy_tts2 --zip

      - name: Prepare firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware-package"
          mapfile -t release_zips < <(find "$PROJECT_ROOT/releases" -maxdepth 1 -type f -name '*.zip' -print 2>/dev/null | sort)
          if [ "${#release_zips[@]}" -eq 1 ]; then
            cp "${release_zips[0]}" "$RUNNER_TEMP/firmware-package/zhengchen-1.54tft-wifi-firmware.zip"
          elif [ "${#release_zips[@]}" -gt 1 ]; then
            echo 'ERROR: More than one release ZIP was generated; refusing to choose automatically.'
            printf ' - %s\n' "${release_zips[@]}"
            exit 1
          else
            merged="$PROJECT_ROOT/build/merged-binary.bin"
            test -s "$merged" || { echo 'ERROR: No release ZIP and build/merged-binary.bin is missing.'; exit 1; }
            cp "$merged" "$RUNNER_TEMP/firmware-package/zhengchen-1.54tft-wifi-merged.bin"
            (cd "$RUNNER_TEMP/firmware-package" && zip -q zhengchen-1.54tft-wifi-firmware.zip zhengchen-1.54tft-wifi-merged.bin)
          fi
          test -s "$RUNNER_TEMP/firmware-package/zhengchen-1.54tft-wifi-firmware.zip"

      - name: Upload build result as downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhengchen-1.54tft-wifi-firmware
          path: ${{ runner.temp }}/firmware-package/zhengchen-1.54tft-wifi-firmware.zip
          if-no-files-found: error
          retention-days: 14
