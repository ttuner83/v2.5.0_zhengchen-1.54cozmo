name: Build Xiaozhi 001 (Zhengchen 1.54 TFT + Cosmo)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build zhengchen-1.54tft-wifi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f CMakeLists.txt || { echo 'ERROR: repository root must contain the Xiaozhi ESP32 source tree (CMakeLists.txt missing).'; exit 1; }
          test -f scripts/build.py || { echo 'ERROR: scripts/build.py not found. Upload the complete Xiaozhi ESP32 v2.5.0 source tree to the repository root.'; exit 1; }
          test -f main/boards/zhengchen/1.54tft-wifi/config.json || { echo 'ERROR: board config for zhengchen/1.54tft-wifi not found in this source tree.'; exit 1; }

      - name: Build firmware
        shell: bash
        env:
          BUILD_BOARD: zhengchen-1.54tft-wifi
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BUILD_BOARD" --name "$BUILD_BOARD"

      - name: Verify firmware output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/merged-binary.bin
          ls -lh build/merged-binary.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: zhengchen-1.54tft-wifi-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 14
